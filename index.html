<head>
  <meta charset="UTF-8" />
  <link href="/favicon.ico" rel="icon shortcut">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
    media="print"
    onload="this.media='all'"
  />
  <title>ORA — Organizational Resilience Analyzer</title>
  <meta name="description" content="Analyze operational dependency and organizational resilience: surface where critical tasks, knowledge and competencies concentrate in too few roles or people." />
  <meta name="author" content="ORA" />

  <meta property="og:title" content="Enter - chat to build websites & apps" />
  <meta property="og:description"
    content="Go from your creative idea to launch your Apps in minutes by Chat and Enter." />
  <meta property="og:image"
    content="https://jtrrmltzqcfjkvribmwe.supabase.co/storage/v1/object/public/enter/enter-og-image-square-1.jpeg" />
</head>

<body>
  <div id="root">
    <!-- Static loading shell: visible immediately so the page never appears
         blank while the app bundle is being served/loaded. React replaces it
         on first render. -->
    <div
      style="display:flex;min-height:100vh;align-items:center;justify-content:center;background:#f7f8fb;color:#182437;font-family:'IBM Plex Sans',ui-sans-serif,system-ui,sans-serif;"
    >
      <div style="text-align:center;">
        <div
          style="width:28px;height:28px;margin:0 auto 14px;border:3px solid rgba(24,36,55,0.15);border-top-color:#182437;border-radius:50%;animation:ora-spin 0.8s linear infinite;"
        ></div>
        <p style="margin:0;font-size:13px;font-weight:600;letter-spacing:0.03em;">ORA &middot; Loading&hellip;</p>
      </div>
    </div>
    <style>
      @keyframes ora-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </div>
  <!-- IMPORTANT: DO NOT REMOVE THIS SCRIPT TAG OR THIS VERY COMMENT! -->
  <script type="module" src="/src/main.tsx"></script>
  <script>
    // Recovery for slow dev-server warm-up: if the entry module fails to load
    // on the first attempt (server still starting), retry it, and as a last
    // resort reload the page once so the freshly warmed server serves a clean
    // page. React replaces the static loading shell, which is how we know the
    // app is up. Detection stops as soon as the app mounts.
    (function () {
      var MAX_RETRIES = 8;
      var RETRY_DELAY = 1800;
      var attempts = 0;
      var inFlight = false;
      var stopped = false;
      var root = document.getElementById("root");

      function appMounted() {
        if (!root || !root.firstElementChild) return false;
        var style = root.firstElementChild.getAttribute("style") || "";
        return style.indexOf("min-height:100vh") === -1;
      }

      function tryReloadOnce() {
        try {
          if (window.sessionStorage.getItem("ora_entry_reload") === "1") return;
          window.sessionStorage.setItem("ora_entry_reload", "1");
        } catch (e) {
          /* sessionStorage unavailable; skip the guard */
        }
        stopped = true;
        window.location.reload();
      }

      function retry() {
        if (stopped || inFlight || attempts >= MAX_RETRIES) {
          if (attempts >= MAX_RETRIES) tryReloadOnce();
          return;
        }
        attempts += 1;
        inFlight = true;
        var s = document.createElement("script");
        s.type = "module";
        s.src = "/src/main.tsx?retry=" + attempts;
        s.onload = function () {
          inFlight = false;
          window.setTimeout(check, 1200);
        };
        s.onerror = function () {
          inFlight = false;
          window.setTimeout(retry, RETRY_DELAY);
        };
        document.body.appendChild(s);
      }

      function check() {
        if (stopped) return;
        if (appMounted()) {
          stopped = true;
          return;
        }
        retry();
        window.setTimeout(check, 2500);
      }

      window.setTimeout(check, 3000);
    })();
  </script>
</body>

</html>
